<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APS Leadership and Learning Dashboard</title>
    
    <!-- Compiled Tailwind CSS CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js DataLabels Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>

    <!-- Leaflet.js Map Library -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- React 18 & React DOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 3px; }
        .bg-navy-800 { background-color: #26365a; }
        .bg-navy-900 { background-color: #1a253e; }
        .bg-navy-950 { background-color: #101728; }
        .border-navy-700 { border-color: #234367; }
        .border-navy-800 { border-color: #26365a; }
        .text-accent-sky { color: #0ea5e9; }
        
        .school-map-marker {
            display: block;
            box-shadow: 0 3px 6px -1px rgba(0, 0, 0, 0.35), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            transition: transform 0.15s ease-in-out;
            cursor: pointer;
            box-sizing: border-box;
            user-select: none;
        }
        .school-map-marker:hover {
            transform: scale(1.35);
            z-index: 1000 !important;
        }
        .marker-circle {
            border-radius: 9999px;
        }
        .marker-diamond {
            transform: rotate(45deg);
            border-radius: 2px;
        }
        .marker-diamond:hover {
            transform: rotate(45deg) scale(1.35);
        }
        .marker-square {
            border-radius: 3px;
        }
        .marker-triangle {
            width: 0 !important;
            height: 0 !important;
            background-color: transparent !important;
            border-left: 9px solid transparent !important;
            border-right: 9px solid transparent !important;
            border-bottom-width: 16px !important;
            border-bottom-style: solid !important;
            border-top: none !important;
            box-shadow: none !important;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35));
            position: relative;
        }
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15);
            padding: 2px;
        }
        .school-hover-tooltip {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 600;
            color: #0f172a;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-shadow: 0 4px 10px -1px rgba(0, 0, 0, 0.15), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
            padding: 3px 8px;
            white-space: nowrap;
        }
    </style>
</head>
<body class="h-full bg-gray-50 text-gray-800 antialiased">

    <div id="root" class="h-full"></div>

    <script>
        const { useState, useEffect, useMemo, useRef, createElement: e } = React;

        if (typeof ChartDataLabels !== 'undefined') {
            Chart.register(ChartDataLabels);
        }

        const FACT_WALKTHROUGHS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ10aRMr6OzbW9MdPhCen0dXh85qkDw98s8Rwjf0JTPQj5kjjRIl4sqjjDCMaDRrawBJvcqYW-Zd7ui/pub?output=csv';
        const DIM_SCHOOL_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSsrR_j6JF0QxYAYVb8Fwt9z9QirdZSxsi9i0_Fb7gbAbPPWDxJPX5g3Cy25OoGFLruIM9f2zmQ7BcT/pub?output=csv';

        const DEFAULT_MAP_CENTER = [35.0844, -106.6504];
        const DEFAULT_MAP_ZOOM = 11;

        const KNOWN_APS_COORDS = {
            'ecademy': [35.1287, -106.5645],
            'polk middle': [35.0210, -106.6853],
            'harrison middle': [35.0112, -106.6698],
            'ernie pyle middle': [35.0392, -106.6710],
            'truman middle': [35.0684, -106.7212],
            'washington middle': [35.0841, -106.6457],
            'garfield middle': [35.1168, -106.6385],
            'cleveland middle': [35.1187, -106.5672],
            'jefferson middle': [35.0845, -106.6041],
            'wilson middle': [35.0645, -106.5925],
            'van buren middle': [35.0681, -106.5741],
            'kennedy middle': [35.1091, -106.5367],
            'eisenhower middle': [35.1541, -106.5162],
            'albuquerque high': [35.0872, -106.6335],
            'highland high': [35.0745, -106.5931],
            'rio grande high': [35.0224, -106.6874],
            'west mesa high': [35.0852, -106.7123],
            'valley high': [35.1325, -106.6455],
            'del norte high': [35.1378, -106.5872],
            'eldorado high': [35.1221, -106.4952],
            'manzano high': [35.0772, -106.5101],
            'sandia high': [35.1292, -106.5512],
            'la cueva high': [35.1762, -106.5298],
            'cibola high': [35.1952, -106.6692],
            'volcano vista high': [35.1782, -106.7321],
            'atrisco heritage': [35.0245, -106.7324]
        };

        function getAlbuquerqueCoordinates(schoolName) {
            const cleanName = (schoolName || '').toLowerCase();
            for (const [key, coords] of Object.entries(KNOWN_APS_COORDS)) {
                if (cleanName.includes(key)) {
                    return coords;
                }
            }

            let hash = 0;
            const str = schoolName || '';
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            const norm1 = Math.abs((hash % 1000) / 1000);
            const norm2 = Math.abs(((hash >> 3) % 1000) / 1000);

            const lat = 35.02 + norm1 * 0.16;
            const lng = -106.72 + norm2 * 0.20;
            return [lat, lng];
        }

        function getColorByCount(count) {
            if (count === 0) return '#94a3b8';
            if (count <= 5) return '#f59e0b';
            if (count <= 10) return '#0284c7';
            return '#10b981';
        }

        function getShapeByLevel(schoolLevel) {
            const lvl = (schoolLevel || '').toLowerCase();
            if (lvl.includes('high')) return 'marker-square';
            if (lvl.includes('middle')) return 'marker-diamond';
            if (lvl.includes('k-8') || lvl.includes('alternative') || lvl.includes('special')) return 'marker-triangle';
            return 'marker-circle';
        }

        function getFallbackAbbreviation(name) {
            if (!name) return 'SCH';
            const clean = name.replace(/school|middle|high|elementary|academy|center|k-8|\(|\)/gi, '').trim();
            const words = clean.split(/\s+/).filter(Boolean);
            if (words.length >= 2) {
                return (words[0][0] + words[1][0] + (words[2] ? words[2][0] : '')).toUpperCase();
            }
            return (words[0] || name).substring(0, 3).toUpperCase();
        }

        function App() {
            const [data, setData] = useState([]);
            const [schoolDimMap, setSchoolDimMap] = useState({});
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [syncTime, setSyncTime] = useState('Not synced yet');
            
            const [walkthroughsExpanded, setWalkthroughsExpanded] = useState(true);

            const [activeDomain, setActiveDomain] = useState('all');
            const [selectedAlignmentBar, setSelectedAlignmentBar] = useState('all');
            const [selectedHqimBar, setSelectedHqimBar] = useState('all');
            const [selectedSchool, setSelectedSchool] = useState('all');
            const [selectedLevel, setSelectedLevel] = useState('all');
            const [selectedFramework, setSelectedFramework] = useState('all');
            const [selectedSupervisor, setSelectedSupervisor] = useState('all');
            const [selectedGrade, setSelectedGrade] = useState('all');

            const [sortConfig, setSortConfig] = useState({ key: 'date', direction: 'desc' });

            const alignChartRef = useRef(null);
            const hqimChartRef = useRef(null);
            const mapContainerRef = useRef(null);

            const alignChartInstance = useRef(null);
            const hqimChartInstance = useRef(null);
            const leafletMapInstance = useRef(null);
            const markersLayerGroup = useRef(null);

            const parseCSV = (text) => {
                const rows = [];
                let row = [];
                let cell = '';
                let inQuotes = false;

                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    const nextChar = text[i + 1];

                    if (char === '"') {
                        if (inQuotes && nextChar === '"') {
                            cell += '"';
                            i++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (char === ',' && !inQuotes) {
                        row.push(cell.trim());
                        cell = '';
                    } else if ((char === '\r' || char === '\n') && !inQuotes) {
                        if (char === '\r' && nextChar === '\n') {
                            i++;
                        }
                        row.push(cell.trim());
                        rows.push(row);
                        row = [];
                        cell = '';
                    } else {
                        cell += char;
                    }
                }
                if (cell || row.length > 0) {
                    row.push(cell.trim());
                    rows.push(row);
                }
                return rows;
            };

            const fetchAllData = async () => {
                setLoading(true);
                setError(null);
                try {
                    const [factRes, dimRes] = await Promise.all([
                        fetch(FACT_WALKTHROUGHS_CSV_URL),
                        fetch(DIM_SCHOOL_CSV_URL)
                    ]);

                    if (!factRes.ok) throw new Error(`Fact Table HTTP ${factRes.status}`);
                    if (!dimRes.ok) throw new Error(`Dim_School HTTP ${dimRes.status}`);

                    const factCsvText = await factRes.text();
                    const dimCsvText = await dimRes.text();

                    const parsedFactRows = parseCSV(factCsvText);
                    const parsedDimRows = parseCSV(dimCsvText);

                    const dimMap = {};
                    if (parsedDimRows.length > 1) {
                        const dimHeaders = parsedDimRows[0].map(function(h) { return h.trim().toLowerCase(); });
                        const schoolKeyIdx = dimHeaders.findIndex(function(h) { return (h.includes('school') && !h.includes('level')) || h === 'name'; });
                        const locIdIdx = dimHeaders.findIndex(function(h) { return h.includes('locationid') || h.includes('location id') || h.includes('location'); });
                        const levelIdx = dimHeaders.findIndex(function(h) { return h.includes('school level') || h.includes('level'); });
                        const frameworkIdx = dimHeaders.findIndex(function(h) { return h.includes('performance framework') || h.includes('framework') || h.includes('aps performance'); });
                        const supervisorIdx = dimHeaders.findIndex(function(h) { return h.includes('supervisor'); });
                        const latIdx = dimHeaders.findIndex(function(h) { return h === 'latitude' || h === 'lat' || h.includes('latitude'); });
                        const lngIdx = dimHeaders.findIndex(function(h) { return h === 'longitude' || h === 'lon' || h === 'lng' || h.includes('longitude'); });

                        parsedDimRows.slice(1).forEach(function(r) {
                            const schoolName = r[schoolKeyIdx >= 0 ? schoolKeyIdx : 0];
                            if (schoolName) {
                                let coords = null;
                                if (latIdx >= 0 && lngIdx >= 0 && r[latIdx] && r[lngIdx]) {
                                    const parsedLat = parseFloat(r[latIdx]);
                                    const parsedLng = parseFloat(r[lngIdx]);
                                    if (!isNaN(parsedLat) && !isNaN(parsedLng)) {
                                        coords = [parsedLat, parsedLng];
                                    }
                                }
                                if (!coords) {
                                    coords = getAlbuquerqueCoordinates(schoolName);
                                }

                                dimMap[schoolName.trim()] = {
                                    rawRow: r,
                                    schoolName: schoolName.trim(),
                                    locationId: (locIdIdx >= 0 ? r[locIdIdx] : '') || 'N/A',
                                    schoolLevel: (levelIdx >= 0 ? r[levelIdx] : '') || 'N/A',
                                    performanceFramework: (frameworkIdx >= 0 ? r[frameworkIdx] : '') || 'N/A',
                                    supervisor: (supervisorIdx >= 0 ? r[supervisorIdx] : '') || 'N/A',
                                    coordinates: coords
                                };
                            }
                        });
                    }
                    setSchoolDimMap(dimMap);

                    if (parsedFactRows.length < 2) throw new Error('Walkthrough Fact CSV appears empty.');

                    const factHeaders = parsedFactRows[0].map(function(h) { return h.trim().toLowerCase(); });
                    const domainIdx = factHeaders.findIndex(function(h) { return h.includes('domain') || h.includes('subject'); });
                    const schoolIdx = factHeaders.findIndex(function(h) { return h.includes('school'); });
                    const dateIdx = factHeaders.findIndex(function(h) { return h.includes('date') || h.includes('timestamp'); });
                    const gradeIdx = factHeaders.findIndex(function(h) { return h.includes('grade level') || h.includes('grade'); });
                    const alignIdx = factHeaders.findIndex(function(h) { return h.includes('standard') || h.includes('alignment'); });
                    const hqimIdx = factHeaders.findIndex(function(h) { return h.includes('hqim') || h.includes('materials'); });
                    const taskIdx = factHeaders.findIndex(function(h) { return h.includes('task') || h.includes('observed') || h.includes('lesson'); });

                    const formatted = parsedFactRows.slice(1)
                        .filter(function(r) {
                            const hasValues = r.some(function(cell) { return cell.length > 0; });
                            const isHeaderRow = r[0] && r[0].toLowerCase().includes('subject domain');
                            return hasValues && !isHeaderRow;
                        })
                        .map(function(r, i) {
                            const rawDomain = (domainIdx >= 0 ? r[domainIdx] : r[0]) || '';
                            let domain = 'Other';
                            
                            if (rawDomain.toLowerCase().includes('math')) {
                                domain = 'Math';
                            } else if (rawDomain.toLowerCase().includes('literacy')) {
                                domain = 'Early Literacy';
                            }

                            const schoolName = (schoolIdx >= 0 ? r[schoolIdx] : r[1]) || 'N/A';
                            const dimData = dimMap[schoolName.trim()] || {};

                            return {
                                id: i + 1,
                                domain: domain,
                                school: schoolName,
                                locationId: dimData.locationId || 'N/A',
                                schoolLevel: dimData.schoolLevel || 'N/A',
                                performanceFramework: dimData.performanceFramework || 'N/A',
                                supervisor: dimData.supervisor || 'N/A',
                                coordinates: dimData.coordinates || getAlbuquerqueCoordinates(schoolName),
                                date: (dateIdx >= 0 ? r[dateIdx] : '') || 'N/A',
                                grade: (gradeIdx >= 0 ? r[gradeIdx] : r[2]) || 'N/A',
                                alignment: (alignIdx >= 0 ? r[alignIdx] : r[4]) || 'Unable to Determine',
                                hqim: (hqimIdx >= 0 ? r[hqimIdx] : r[5]) || 'Not Observed',
                                task: (taskIdx >= 0 ? r[taskIdx] : r[6]) || 'N/A'
                            };
                        })
                        .filter(function(item) { return item.domain === 'Math' || item.domain === 'Early Literacy'; });

                    setData(formatted);
                    setSyncTime(new Date().toLocaleTimeString());
                } catch (err) {
                    console.error("Star Schema Data Fetch Error:", err);
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(function() {
                fetchAllData();
                const interval = setInterval(fetchAllData, 900000);
                return function() { clearInterval(interval); };
            }, []);

            const schoolsList = useMemo(function() {
                const combined = Object.keys(schoolDimMap).length > 0 ? Object.keys(schoolDimMap) : data.map(function(d) { return d.school; });
                return [...new Set(combined)].filter(function(s) { return s && s !== 'N/A'; }).sort();
            }, [data, schoolDimMap]);

            const levelsList = useMemo(function() {
                const dimLevels = Object.values(schoolDimMap).map(function(s) { return s.schoolLevel; });
                const factLevels = data.map(function(d) { return d.schoolLevel; });
                return [...new Set([...dimLevels, ...factLevels])].filter(function(l) { return l && l !== 'N/A'; }).sort();
            }, [data, schoolDimMap]);

            const frameworksList = useMemo(function() {
                const dimFrameworks = Object.values(schoolDimMap).map(function(s) { return s.performanceFramework; });
                const factFrameworks = data.map(function(d) { return d.performanceFramework; });
                return [...new Set([...dimFrameworks, ...factFrameworks])].filter(function(f) { return f && f !== 'N/A'; }).sort();
            }, [data, schoolDimMap]);

            const supervisorsList = useMemo(function() {
                const dimSupervisors = Object.values(schoolDimMap).map(function(s) { return s.supervisor; });
                const factSupervisors = data.map(function(d) { return d.supervisor; });
                return [...new Set([...dimSupervisors, ...factSupervisors])].filter(function(s) { return s && s !== 'N/A'; }).sort();
            }, [data, schoolDimMap]);

            const gradesList = useMemo(function() {
                const uniqueGrades = [...new Set(data.map(function(d) { return d.grade; }))].filter(function(g) { return g && g !== 'N/A'; });
                return uniqueGrades.sort(function(a, b) {
                    const numA = parseFloat(a.replace(/[^0-9.]/g, ''));
                    const numB = parseFloat(b.replace(/[^0-9.]/g, ''));
                    if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
                    return a.localeCompare(b);
                });
            }, [data]);

            // Base filtered data respecting top-bar switches and dropdown filters across all components
            const filteredData = useMemo(function() {
                return data.filter(function(item) {
                    const matchesDomain = activeDomain === 'all' || item.domain === activeDomain;
                    const matchesSchool = selectedSchool === 'all' || item.school === selectedSchool;
                    const matchesLevel = selectedLevel === 'all' || item.schoolLevel === selectedLevel;
                    const matchesFramework = selectedFramework === 'all' || item.performanceFramework === selectedFramework;
                    const matchesSupervisor = selectedSupervisor === 'all' || item.supervisor === selectedSupervisor;
                    const matchesGrade = selectedGrade === 'all' || item.grade === selectedGrade;
                    return matchesDomain && matchesSchool && matchesLevel && matchesFramework && matchesSupervisor && matchesGrade;
                });
            }, [data, activeDomain, selectedSchool, selectedLevel, selectedFramework, selectedSupervisor, selectedGrade]);

            // Filtered dataset including interactive chart bar clicks for the table view
            const tableFilteredData = useMemo(function() {
                return filteredData.filter(function(item) {
                    let matchesAlignBar = true;
                    const alignLower = item.alignment.toLowerCase().trim();
                    if (selectedAlignmentBar === 'Observed') {
                        matchesAlignBar = alignLower === 'observed';
                    } else if (selectedAlignmentBar === 'Partially Observed') {
                        matchesAlignBar = alignLower.includes('partial');
                    } else if (selectedAlignmentBar === 'Other / Not Observed') {
                        matchesAlignBar = !alignLower.includes('observed') || alignLower.includes('not');
                    }

                    let matchesHqimBar = true;
                    const hqimLower = item.hqim.toLowerCase().trim();
                    if (selectedHqimBar === 'Observed') {
                        matchesHqimBar = hqimLower === 'observed';
                    } else if (selectedHqimBar === 'Partially Observed') {
                        matchesHqimBar = hqimLower.includes('partial');
                    } else if (selectedHqimBar === 'Other / Not Observed') {
                        matchesHqimBar = !hqimLower.includes('observed') || hqimLower.includes('not observed') || hqimLower.includes('unable') || hqimLower === 'n/a' || !hqimLower;
                    }

                    return matchesAlignBar && matchesHqimBar;
                });
            }, [filteredData, selectedAlignmentBar, selectedHqimBar]);

            const sortedData = useMemo(function() {
                if (!sortConfig.key) return tableFilteredData;
                const sorted = [...tableFilteredData].sort(function(a, b) {
                    let valA = a[sortConfig.key] || '';
                    let valB = b[sortConfig.key] || '';

                    if (sortConfig.key === 'grade') {
                        const numA = parseFloat(String(valA).replace(/[^0-9.]/g, ''));
                        const numB = parseFloat(String(valB).replace(/[^0-9.]/g, ''));
                        if (!isNaN(numA) && !isNaN(numB)) {
                            return sortConfig.direction === 'asc' ? numA - numB : numB - numA;
                        }
                    }

                    if (sortConfig.key === 'date') {
                        const dateA = new Date(valA).getTime();
                        const dateB = new Date(valB).getTime();
                        if (!isNaN(dateA) && !isNaN(dateB)) {
                            return sortConfig.direction === 'asc' ? dateA - dateB : dateB - dateA;
                        }
                    }

                    valA = String(valA).toLowerCase();
                    valB = String(valB).toLowerCase();
                    return sortConfig.direction === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                });
                return sorted;
            }, [tableFilteredData, sortConfig]);

            const handleSort = function(key) {
                setSortConfig(function(prev) {
                    if (prev.key === key) {
                        return { key: key, direction: prev.direction === 'asc' ? 'desc' : 'asc' };
                    }
                    return { key: key, direction: 'asc' };
                });
            };

            const renderSortIcon = function(key) {
                if (sortConfig.key !== key) {
                    return e('i', { className: 'fa-solid fa-sort text-gray-300 ml-1.5 text-[10px] flex-shrink-0' });
                }
                return sortConfig.direction === 'asc'
                    ? e('i', { className: 'fa-solid fa-sort-up text-blue-600 ml-1.5 text-[10px] flex-shrink-0' })
                    : e('i', { className: 'fa-solid fa-sort-down text-blue-600 ml-1.5 text-[10px] flex-shrink-0' });
            };

            // KPI Metrics responsive to all active filters
            const metrics = useMemo(function() {
                const total = filteredData.length;
                const alignObserved = filteredData.filter(function(w) { 
                    return w.alignment.toLowerCase().trim() === 'observed'; 
                }).length;
                const alignPct = total > 0 ? Math.round((alignObserved / total) * 100) : 0;

                const hqimObserved = filteredData.filter(function(w) { 
                    return w.hqim.toLowerCase().trim() === 'observed'; 
                }).length;
                const hqimPct = total > 0 ? Math.round((hqimObserved / total) * 100) : 0;

                const dimSchools = Object.values(schoolDimMap);
                const eligibleDimSchools = dimSchools.length > 0 ? dimSchools.filter(function(sch) {
                    const matchesSchool = selectedSchool === 'all' || sch.schoolName === selectedSchool;
                    const matchesLevel = selectedLevel === 'all' || sch.schoolLevel === selectedLevel;
                    const matchesFramework = selectedFramework === 'all' || sch.performanceFramework === selectedFramework;
                    const matchesSupervisor = selectedSupervisor === 'all' || sch.supervisor === selectedSupervisor;
                    return matchesSchool && matchesLevel && matchesFramework && matchesSupervisor;
                }) : [];

                const uniqueSchoolsObserved = new Set(filteredData.map(function(w) { return w.school; })).size;
                const totalPossibleSchools = eligibleDimSchools.length > 0 
                    ? eligibleDimSchools.length 
                    : (Object.keys(schoolDimMap).length > 0 ? Object.keys(schoolDimMap).length : uniqueSchoolsObserved);

                return { 
                    total, 
                    alignPct, 
                    hqimPct, 
                    uniqueSchools: uniqueSchoolsObserved, 
                    totalPossibleSchools 
                };
            }, [filteredData, schoolDimMap, selectedSchool, selectedLevel, selectedFramework, selectedSupervisor]);

            // Chart Rendering Logic - synchronized to shared y-axis scale, identical label formats ('Observed', 'Partially Observed', 'Other / Not Observed')
            useEffect(function() {
                if (!alignChartRef.current || !hqimChartRef.current) return;

                const chartBaseData = filteredData;
                const chartTotal = chartBaseData.length;

                const alignObserved = chartBaseData.filter(function(w) { return w.alignment.toLowerCase().trim() === 'observed'; }).length;
                const alignPartial = chartBaseData.filter(function(w) { return w.alignment.toLowerCase().includes('partial'); }).length;
                const alignOther = Math.max(0, chartTotal - (alignObserved + alignPartial));
