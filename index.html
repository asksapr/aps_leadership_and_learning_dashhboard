<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APS Leadership and Learning Dashboard</title>

    <!-- Compiled Tailwind CSS CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js (pinned to v4; an unpinned URL would silently pick up future major releases) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
    <!-- Chart.js DataLabels Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>

    <!-- Leaflet.js Map Library -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- React 18 & React DOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 3px; }
        .bg-navy-800 { background-color: #26365a; }
        .bg-navy-900 { background-color: #1a253e; }
        .bg-navy-950 { background-color: #101728; }
        .border-navy-700 { border-color: #234367; }
        .border-navy-800 { border-color: #26365a; }
        .text-accent-sky { color: #0ea5e9; }

        /* Utilities the Tailwind 2.2 CDN build does not include (arbitrary values, opacity
           shorthands, sky palette). Without these the classes are silently ignored. */
        .text-\[9px\] { font-size: 9px; line-height: 1.3; }
        .text-\[10px\] { font-size: 10px; line-height: 1.35; }
        .text-\[11px\] { font-size: 11px; line-height: 1.4; }
        @media (min-width: 640px) {
            .sm\:text-\[10px\] { font-size: 10px; line-height: 1.35; }
            .sm\:text-\[11px\] { font-size: 11px; line-height: 1.4; }
            .sm\:max-w-none { max-width: none; }
        }
        .max-w-\[140px\] { max-width: 140px; }
        .min-h-16 { min-height: 4rem; }
        .shadow-xs, .shadow-sm { box-shadow: 0 1px 2px 0 rgba(15, 23, 42, 0.05); }
        .backdrop-blur-xs { backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
        .bg-navy-950\/70 { background-color: rgba(16, 23, 40, 0.7); }
        .bg-blue-500\/20 { background-color: rgba(59, 130, 246, 0.2); }
        .hover\:bg-blue-500\/30:hover { background-color: rgba(59, 130, 246, 0.3); }
        .border-gray-200\/60 { border-color: rgba(229, 231, 235, 0.6); }
        .border-navy-700\/60 { border-color: rgba(35, 67, 103, 0.6); }
        .-webkit-overflow-scrolling-touch { -webkit-overflow-scrolling: touch; }
        .bg-sky-50 { background-color: #f0f9ff; }
        .bg-sky-100 { background-color: #e0f2fe; }
        .text-sky-600 { color: #0284c7; }
        .text-sky-700 { color: #0369a1; }
        .text-sky-800 { color: #075985; }

        /* Shared look: secondary text a step darker than Tailwind's gray-400 for contrast */
        main .text-gray-400 { color: #6b7280; }
        .nav-section-label { font-size: 10px; letter-spacing: 0.06em; }

        /* Goals and Guardrails Status progress bars */
        .progress-track { position: relative; height: 8px; border-radius: 9999px; background: #e5e7eb; overflow: visible; }
        .progress-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 9999px; }
        .progress-target { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #111827; border-radius: 1px; }

        .school-map-marker {
            display: block;
            box-shadow: 0 3px 6px -1px rgba(0, 0, 0, 0.35), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            transition: transform 0.15s ease-in-out;
            cursor: pointer;
            box-sizing: border-box;
            user-select: none;
        }
        .school-map-marker:hover, .school-map-marker:active {
            transform: scale(1.35);
            z-index: 1000 !important;
        }
        .marker-circle {
            border-radius: 9999px;
        }
        .marker-diamond {
            transform: rotate(45deg);
            border-radius: 2px;
        }
        .marker-diamond:hover, .marker-diamond:active {
            transform: rotate(45deg) scale(1.35);
        }
        .marker-square {
            border-radius: 3px;
        }
        .marker-triangle {
            width: 0 !important;
            height: 0 !important;
            background-color: transparent !important;
            border-left: 9px solid transparent !important;
            border-right: 9px solid transparent !important;
            border-bottom-width: 16px !important;
            border-bottom-style: solid !important;
            border-top: none !important;
            box-shadow: none !important;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35));
            position: relative;
        }
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15);
            padding: 2px;
        }
        /* Map sizing: Tailwind 2.2 CDN has no arbitrary-value classes (min-h-[...]),
           so the map needs explicit heights or it collapses to 0px in the stacked mobile layout. */
        .map-frame {
            position: relative;
            height: 320px;
            min-height: 320px;
        }
        @media (min-width: 640px) {
            .map-frame { height: 380px; min-height: 380px; }
        }
        @media (min-width: 1024px) {
            .map-frame { height: auto; min-height: 360px; }
        }
        .map-canvas {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
        }
        .leaflet-container img.leaflet-tile { max-width: none !important; }
        .th-label {
            white-space: normal;
            word-break: keep-all;
            overflow-wrap: normal;
            hyphens: none;
        }
        /* Walkthrough map legend row labels. Tailwind 2.2 CDN ignores text-[9px]-style classes, so size them here. */
        .legend-label { font-size: 10px; }
        @media (min-width: 640px) { .legend-label { font-size: 11px; } }
        .school-hover-tooltip {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 600;
            color: #0f172a;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-shadow: 0 4px 10px -1px rgba(0, 0, 0, 0.15), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
            padding: 3px 8px;
            white-space: nowrap;
        }
    </style>
</head>
<body class="h-full bg-gray-50 text-gray-800 antialiased selection:bg-blue-100">

    <div id="root" class="h-full"></div>

    <script>
        const { useState, useEffect, useMemo, useRef, createElement: e } = React;

        if (typeof ChartDataLabels !== 'undefined') {
            Chart.register(ChartDataLabels);
        }

        const FACT_WALKTHROUGHS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ10aRMr6OzbW9MdPhCen0dXh85qkDw98s8Rwjf0JTPQj5kjjRIl4sqjjDCMaDRrawBJvcqYW-Zd7ui/pub?output=csv';
        const DIM_SCHOOL_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSsrR_j6JF0QxYAYVb8Fwt9z9QirdZSxsi9i0_Fb7gbAbPPWDxJPX5g3Cy25OoGFLruIM9f2zmQ7BcT/pub?output=csv';

        // Interim Guardrail 2.2: combined Instructional Visits sheet (fact_instructional_visits_master_sheet, "Master Combined" tab)
        const FACT_VISITS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT8vBlqDz3pXA-SS1_UYKnlVmomIOiRuBiTS5v6W9VJg4dkTQiQxCIqJVpFNZfsbiRB2hSx1Sn-sqJA/pub?output=csv';

        // Owners view: dim_initiative_owners (one row per promising practice or initiative, keyed by Initiative ID)
        const DIM_INITIATIVE_OWNERS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQZ1kUPCvovBNSWvwNESxWgk1n3P6DmB3GDlTNfEeAXdrkxnoQ1TFY1orxVb07uHxc0cGSc6rZ53Cnn/pub?output=csv';
        // Owners view: dim_goal_and_guardrail (one row per goal, interim goal, or interim guardrail, keyed by Goal ID)
        const DIM_GOAL_GUARDRAIL_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQwTzSgBRqFWxyVXZqMK2BNJ3DPWjIhHzOK7wFL6PFr3qYSyVcV-dAW_UyI_HmAiZOaBh_JCNsHetZD/pub?output=csv';
        const OWNER_UNASSIGNED = 'Not Assigned';

        // Goals and Guardrails Status view: fact_district_goals (one row per Goal ID per School Year)
        const FACT_DISTRICT_GOALS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS4Hz6UlpCiSu0G59KnB7KkyjQAtrazdBYisoZAWF93AcxWtF18OtF9ei7gYc-Slh-5MiXzyI59MhXh/pub?output=csv';
        // One status palette for every view: green = meeting, amber = needs attention,
        // red = not meeting, gray = no data, blue = scheduled or informational.
        const STATUS_COLORS = {
            meeting: '#10b981',
            attention: '#f59e0b',
            notMeeting: '#e11d48',
            noData: '#94a3b8',
            info: '#0284c7'
        };
        const GOAL_STATUS_COLORS = {
            'On-Track': STATUS_COLORS.meeting,
            'Off-Track': STATUS_COLORS.notMeeting,
            'Pending': STATUS_COLORS.attention,
            'No Data': STATUS_COLORS.noData
        };

        const MONTH_ABBR = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        // "2026-09-01" or "9/1/2026" -> "Sep 1, 2026". Anything unrecognized is returned as entered.
        function formatDisplayDate(raw) {
            const s = (raw || '').trim();
            if (!s) return '';
            let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
            if (m) return `${MONTH_ABBR[parseInt(m[2], 10) - 1] || m[2]} ${parseInt(m[3], 10)}, ${m[1]}`;
            m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (m) return `${MONTH_ABBR[parseInt(m[1], 10) - 1] || m[1]} ${parseInt(m[2], 10)}, ${m[3]}`;
            return s;
        }

        // Visit dates outside this window are treated as likely typos (e.g. "10/2/20206" or "10/20/2025")
        // and flagged for review instead of being counted as past or upcoming. Update each school year.
        const VISITS_SCHOOL_YEAR_LABEL = '2026-27';
        const VISITS_SCHOOL_YEAR_START = new Date(2026, 6, 1);
        const VISITS_SCHOOL_YEAR_END = new Date(2027, 5, 30, 23, 59, 59);

        const VISIT_STATUSES = ['Completed', 'Scheduled', 'Past Date, Not Marked Complete', 'No Date Set', 'Date Needs Review'];
        const VISIT_STATUS_COLORS = {
            'Completed': '#10b981',
            'Scheduled': '#0284c7',
            'Past Date, Not Marked Complete': '#f59e0b',
            'No Date Set': '#94a3b8',
            'Date Needs Review': '#e11d48'
        }; // same hues as STATUS_COLORS: meeting, info, attention, no data, not meeting

        const DEFAULT_MAP_CENTER = [35.0844, -106.6504];
        const DEFAULT_MAP_ZOOM = 11;

        const KNOWN_APS_COORDS = {
            'ecademy': [35.1287, -106.5645],
            'polk middle': [35.0210, -106.6853],
            'harrison middle': [35.0112, -106.6698],
            'ernie pyle middle': [35.0392, -106.6710],
            'truman middle': [35.0684, -106.7212],
            'washington middle': [35.0841, -106.6457],
            'garfield middle': [35.1168, -106.6385],
            'cleveland middle': [35.1187, -106.5672],
            'jefferson middle': [35.0845, -106.6041],
            'wilson middle': [35.0645, -106.5925],
            'van buren middle': [35.0681, -106.5741],
            'kennedy middle': [35.1091, -106.5367],
            'eisenhower middle': [35.1541, -106.5162],
            'albuquerque high': [35.0872, -106.6335],
            'highland high': [35.0745, -106.5931],
            'rio grande high': [35.0224, -106.6874],
            'west mesa high': [35.0852, -106.7123],
            'valley high': [35.1325, -106.6455],
            'del norte high': [35.1378, -106.5872],
            'eldorado high': [35.1221, -106.4952],
            'manzano high': [35.0772, -106.5101],
            'sandia high': [35.1292, -106.5512],
            'la cueva high': [35.1762, -106.5298],
            'cibola high': [35.1952, -106.6692],
            'volcano vista high': [35.1782, -106.7321],
            'atrisco heritage': [35.0245, -106.7324]
        };

        function getAlbuquerqueCoordinates(schoolName) {
            const cleanName = (schoolName || '').toLowerCase();
            for (const [key, coords] of Object.entries(KNOWN_APS_COORDS)) {
                if (cleanName.includes(key)) {
                    return coords;
                }
            }

            // No coordinates in dim_school and no known location: leave the school off the map
            // rather than placing a pin at an invented point.
            return null;
        }

        function getColorByCount(count) {
            if (count === 0) return '#94a3b8';
            if (count <= 5) return '#f59e0b';
            if (count <= 10) return '#0284c7';
            return '#10b981';
        }

        // Walkthrough observation badges use the shared status palette
        function observationBadgeClass(value) {
            const v = (value || '').toLowerCase().trim();
            if (v === 'observed') return 'bg-green-100 text-green-800';
            if (v.includes('partial')) return 'bg-yellow-100 text-yellow-800';
            return 'bg-gray-100 text-gray-700';
        }

        function getShapeByLevel(schoolLevel, schoolName) {
            const lvl = (schoolLevel || '').toLowerCase().trim();
            const name = (schoolName || '').toLowerCase().trim();

            if (
                lvl.includes('k-8') || lvl.includes('k8') || lvl.includes('alt') || lvl.includes('special') ||
                name.includes('k-8') || name.includes('k8') || name.includes('alternative')
            ) {
                return 'marker-triangle';
            }

            if (
                lvl === 'hs' || lvl === 'h.s.' || lvl.includes('high') || /\bhs\b/.test(lvl) ||
                name.includes('high school') || /\bhs\b/.test(name) || name.includes(' high')
            ) {
                return 'marker-square';
            }

            if (
                lvl === 'ms' || lvl === 'm.s.' || lvl.includes('middle') || /\bms\b/.test(lvl) || lvl.includes('junior') ||
                name.includes('middle school') || name.includes('middle') || /\bms\b/.test(name) || name.includes('junior high')
            ) {
                return 'marker-diamond';
            }

            return 'marker-circle';
        }

        // ---------- Interim Guardrail 2.2: Instructional Visits helpers ----------

        function escapeHtml(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        // Parses m/d/yyyy (the published-CSV format) and flags dates outside the school year window.
        function parseVisitDate(raw) {
            const s = (raw || '').trim();
            if (!s) return { date: null, issue: null };
            let d = null;
            const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,5})$/);
            if (m) {
                let year = parseInt(m[3], 10);
                if (m[3].length === 2) year += 2000;
                const month = parseInt(m[1], 10) - 1;
                d = new Date(year, month, parseInt(m[2], 10));
                if (d.getMonth() !== month) d = null;
            } else {
                const t = new Date(s);
                if (!isNaN(t.getTime())) d = new Date(t.getFullYear(), t.getMonth(), t.getDate());
            }
            if (!d || isNaN(d.getTime())) return { date: null, issue: 'Unreadable date' };
            if (d < VISITS_SCHOOL_YEAR_START || d > VISITS_SCHOOL_YEAR_END) {
                return { date: null, issue: `Outside the ${VISITS_SCHOOL_YEAR_LABEL} school year` };
            }
            return { date: d, issue: null };
        }

        // Splits a multi-select cell on commas, keeping quoted items such as
        // "Instruction — Skills, Habits, and Mindsets" together.
        function splitMeasures(cell) {
            const out = [];
            let cur = '';
            let inQuotes = false;
            for (const ch of (cell || '')) {
                if (ch === '"') { inQuotes = !inQuotes; continue; }
                if (ch === ',' && !inQuotes) {
                    if (cur.trim()) out.push(cur.trim());
                    cur = '';
                    continue;
                }
                cur += ch;
            }
            if (cur.trim()) out.push(cur.trim());
            return out;
        }

        function normSchoolName(name) {
            return (name || '').toLowerCase().replace(/&/g, ' and ').replace(/[.'’]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
        }

        function coreSchoolName(name) {
            return normSchoolName(name)
                .replace(/\b(school|schools|elementary|middle|high|academy|magnet|primary|k 8|k8)\b/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        // Matches visit-sheet school names to dim_school keys: exact, then punctuation/case-insensitive,
        // then core name with level words removed (only when that core name is unique in dim_school).
        function buildSchoolMatcher(dimMap) {
            const exact = {};
            const core = {};
            // Keys ignore spacing so "S.R. Marmon" and "S. R. Marmon" compare equal.
            const compact = function(s) { return s.replace(/\s+/g, ''); };
            Object.keys(dimMap).forEach(function(key) {
                const n = compact(normSchoolName(key));
                if (n) exact[n] = key;
                const c = compact(coreSchoolName(key));
                if (c) (core[c] = core[c] || []).push(key);
            });
            return function(name) {
                if (dimMap[name]) return name;
                const n = compact(normSchoolName(name));
                if (exact[n]) return exact[n];
                const c = compact(coreSchoolName(name));
                if (c && core[c] && core[c].length === 1) return core[c][0];
                return null;
            };
        }

        function buildVisits(parsedRows, dimMap) {
            if (!parsedRows || parsedRows.length < 2) return [];
            const headers = parsedRows[0].map(function(h) { return h.trim().toLowerCase(); });
            const find = function(fn) { return headers.findIndex(fn); };
            const staffIdx = find(function(h) { return h.includes('staff') || h.includes('source'); });
            const schoolIdx = find(function(h) { return h.includes('school'); });
            const desigIdx = find(function(h) { return h.includes('designation'); });
            const dateIdx = find(function(h) { return h.includes('date'); });
            const statusIdx = find(function(h) { return h.includes('status'); });
            const measureIdx = find(function(h) { return h.includes('measure') || h.includes('leadership tool'); });
            const reasonIdx = find(function(h) { return h.includes('reason'); });
            const notesIdx = find(function(h) { return h.includes('note'); });
            const get = function(r, i) { return (i >= 0 && r[i] != null) ? String(r[i]).trim() : ''; };

            const match = buildSchoolMatcher(dimMap);
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            return parsedRows.slice(1).map(function(r, i) {
                const school = get(r, schoolIdx);
                if (!school || school.toLowerCase() === 'school name') return null;

                const rawDate = get(r, dateIdx);
                const parsed = parseVisitDate(rawDate);
                const rawStatus = get(r, statusIdx);
                const rawStatusLower = rawStatus.toLowerCase();

                let status;
                if (rawStatusLower === 'completed' || rawStatusLower === 'complete') status = 'Completed';
                else if (parsed.issue) status = 'Date Needs Review';
                else if (!parsed.date) status = 'No Date Set';
                else if (parsed.date < today) status = 'Past Date, Not Marked Complete';
                else status = 'Scheduled';

                const dimKey = match(school);
                const dim = dimKey ? dimMap[dimKey] : null;
                const d = parsed.date;

                return {
                    id: i + 1,
                    staff: get(r, staffIdx) || 'Unassigned',
                    school: school,
                    dimKey: dimKey,
                    designation: get(r, desigIdx) || 'Not Listed',
                    rawDate: rawDate,
                    date: d,
                    dateIssue: parsed.issue,
                    monthKey: d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}` : null,
                    rawStatus: rawStatus,
                    status: status,
                    measures: splitMeasures(get(r, measureIdx)),
                    reason: get(r, reasonIdx),
                    notes: get(r, notesIdx),
                    schoolLevel: dim ? dim.schoolLevel : 'N/A',
                    supervisor: dim ? dim.supervisor : 'N/A'
                };
            }).filter(Boolean);
        }

        // Fallback only, for a sheet with no type column: the type comes from the ID.
        // GOAL1 = Goal, GOAL1.1 = Interim Goal, GUARDRAIL1.1 = Interim Guardrail.
        // dim_goal_and_guardrail has an Item Type column, which takes precedence.
        function deriveMeasureType(id) {
            const v = (id || '').trim().toUpperCase();
            if (v.indexOf('GUARDRAIL') === 0) return 'Interim Guardrail';
            if (/^GOAL\s*\d+\.\d+/.test(v)) return 'Interim Goal';
            if (v.indexOf('GOAL') === 0) return 'Goal';
            return '';
        }

        function isUnassigned(value) {
            const v = (value || '').trim().toLowerCase();
            return !v || v === 'not assigned';
        }

        // Parses dim_initiative_owners and dim_goal_and_guardrail by header text so column order can change in the sheet.
        // Parent Goal ID, Has Target, and Rollup Rule exist only in dim_goal_and_guardrail; they stay blank for initiatives.
        function buildOwners(parsedRows) {
            if (!parsedRows || parsedRows.length < 2) return [];
            const headers = parsedRows[0].map(function(h) { return h.trim().toLowerCase(); });
            const find = function(fn) { return headers.findIndex(fn); };
            const parentIdx = find(function(h) { return h.includes('parent'); });
            const hasTargetIdx = find(function(h) { return h.includes('has target'); });
            const rollupIdx = find(function(h) { return h.includes('rollup'); });
            const directionIdx = find(function(h) { return h.includes('direction'); });
            const unitIdx = find(function(h) { return h === 'unit' || h.indexOf('unit ') === 0; });
            const idIdx = find(function(h, i) { return i !== parentIdx && (h === 'initiative id' || /\bid\b/.test(h)); });
            const nameIdx = find(function(h) { return h.includes('name'); });
            const typeIdx = find(function(h) { return h.includes('measure') || h.includes('type'); });
            const cabinetIdx = find(function(h) { return h.includes('cabinet'); });
            const sponsorIdx = find(function(h) { return h.includes('sponsor'); });
            const ownerIdx = find(function(h) { return h.includes('owner'); });
            const get = function(r, i) { return (i >= 0 && r[i] != null) ? String(r[i]).trim() : ''; };
            const person = function(v) { return isUnassigned(v) ? OWNER_UNASSIGNED : v; };

            return parsedRows.slice(1).map(function(r, i) {
                return {
                    order: i,
                    id: get(r, idIdx),
                    name: get(r, nameIdx),
                    measureType: get(r, typeIdx) || deriveMeasureType(get(r, idIdx)) || 'Not Listed',
                    cabinet: person(get(r, cabinetIdx)),
                    sponsor: person(get(r, sponsorIdx)),
                    owner: person(get(r, ownerIdx)),
                    parentId: get(r, parentIdx),
                    // Grouping rows (e.g. GOAL4) have Has Target = FALSE; a missing column means TRUE
                    hasTarget: hasTargetIdx < 0 || get(r, hasTargetIdx).toUpperCase() !== 'FALSE',
                    rollupRule: get(r, rollupIdx),
                    direction: get(r, directionIdx),
                    unit: get(r, unitIdx)
                };
            }).filter(function(o) { return o.id || o.name; });
        }

        // ---------- Goals and Guardrails Status helpers ----------

        function parseNumber(value) {
            const s = (value || '').replace(/[,%\s]/g, '');
            if (!s) return null;
            const n = parseFloat(s);
            return isNaN(n) ? null : n;
        }

        function normalizeGoalStatus(value) {
            const s = (value || '').trim().toLowerCase();
            if (!s) return '';
            if (s.indexOf('off') === 0) return 'Off-Track';
            if (s.indexOf('on') === 0) return 'On-Track';
            return '';
        }

        // Parses fact_district_goals by header text so column order can change in the sheet.
        function buildDistrictGoals(parsedRows) {
            if (!parsedRows || parsedRows.length < 2) return [];
            const headers = parsedRows[0].map(function(h) { return h.trim().toLowerCase(); });
            const find = function(fn) { return headers.findIndex(fn); };
            const yearIdx = find(function(h) { return h.includes('year'); });
            const idIdx = find(function(h) { return h.includes('goal id') || /\bid\b/.test(h); });
            const targetIdx = find(function(h) { return h.includes('target'); });
            const actualIdx = find(function(h) { return h.includes('actual'); });
            const asOfIdx = find(function(h) { return h.includes('as of') || h.includes('date'); });
            const statusIdx = find(function(h) { return h.includes('status'); });
            const get = function(r, i) { return (i >= 0 && r[i] != null) ? String(r[i]).trim() : ''; };

            return parsedRows.slice(1).map(function(r, i) {
                return {
                    order: i,
                    schoolYear: get(r, yearIdx),
                    goalId: get(r, idIdx),
                    target: parseNumber(get(r, targetIdx)),
                    actual: parseNumber(get(r, actualIdx)),
                    asOf: get(r, asOfIdx),
                    storedStatus: normalizeGoalStatus(get(r, statusIdx))
                };
            }).filter(function(f) { return f.goalId; });
        }

        // Status for one measured row. A Status entered in the sheet wins; otherwise it is computed from
        // actual vs target (actual >= target, or <= when Direction says lower is better). Higher is better by default.
        function computeGoalStatus(fact, dimRow) {
            if (!fact) return { status: 'No Data', computed: '' };
            let computed = '';
            if (fact.actual != null && fact.target != null) {
                const lowerIsBetter = !!(dimRow && /lower/i.test(dimRow.direction || ''));
                const met = lowerIsBetter ? fact.actual <= fact.target : fact.actual >= fact.target;
                computed = met ? 'On-Track' : 'Off-Track';
            }
            return { status: fact.storedStatus || computed || 'Pending', computed: computed };
        }

        // Unit from dim_goal_and_guardrail when present; otherwise values between 0 and 1 are treated as proportions.
        function isPercentMeasure(dimRow, fact) {
            const unit = ((dimRow && dimRow.unit) || '').toLowerCase();
            if (unit) return unit.indexOf('percent') === 0 || unit === '%';
            if (!fact) return true;
            return [fact.target, fact.actual].every(function(v) { return v == null || Math.abs(v) <= 1; });
        }

        function formatGoalValue(v, pct) {
            if (v == null) return '';
            return pct ? `${(v * 100).toFixed(1)}%` : v.toLocaleString('en-US', { maximumFractionDigits: 2 });
        }

        function formatGoalGap(fact, pct) {
            if (!fact || fact.actual == null || fact.target == null) return '';
            const d = fact.actual - fact.target;
            const sign = d > 0 ? '+' : (d < 0 ? '-' : '');
            const size = pct ? `${(Math.abs(d) * 100).toFixed(1)} pts` : Math.abs(d).toLocaleString('en-US', { maximumFractionDigits: 2 });
            return sign + size;
        }

        // "All Goal Measure children on track" -> "goal measure"
        function parseRollupType(rule) {
            const m = (rule || '').match(/^\s*all\s+(.+?)\s+children\s+on\s+track\s*$/i);
            return m ? m[1].trim().toLowerCase() : null;
        }

        // Depth in the goal hierarchy from Parent Goal ID (0 = top level). Guards against cycles.
        function buildDepthMap(rows) {
            const byId = {};
            rows.forEach(function(r) { if (r.id) byId[r.id] = r; });
            const depth = {};
            rows.forEach(function(r) {
                let d = 0;
                let cur = r;
                const seen = {};
                while (cur && cur.parentId && byId[cur.parentId] && !seen[cur.parentId] && d < 10) {
                    seen[cur.parentId] = true;
                    cur = byId[cur.parentId];
                    d += 1;
                }
                depth[r.order] = d;
            });
            return depth;
        }

        function App() {
            const [data, setData] = useState([]);
            const [schoolDimMap, setSchoolDimMap] = useState({});
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [syncTime, setSyncTime] = useState('not yet');

            // Which dashboard is showing: 'status' (landing view), 'owners', 'visits' (Guardrail 2.2) or 'walkthroughs' (Guardrail 3.1)
            const [activeView, setActiveView] = useState('status');
            const [visits, setVisits] = useState([]);
            const [visitsError, setVisitsError] = useState(null);
            const [owners, setOwners] = useState([]);
            const [ownersError, setOwnersError] = useState(null);
            const [goals, setGoals] = useState([]);
            const [goalsError, setGoalsError] = useState(null);
            const [districtGoals, setDistrictGoals] = useState([]);
            const [districtGoalsError, setDistrictGoalsError] = useState(null);

            const [guardrailExpanded, setGuardrailExpanded] = useState(true);
            const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
            const [mobileNavOpen, setMobileNavOpen] = useState(false);

            const [activeDomain, setActiveDomain] = useState('all');
            const [selectedAlignmentBar, setSelectedAlignmentBar] = useState('all');
            const [selectedHqimBar, setSelectedHqimBar] = useState('all');
            const [selectedSchool, setSelectedSchool] = useState('all');
            const [selectedLevel, setSelectedLevel] = useState('all');
            const [selectedFramework, setSelectedFramework] = useState('all');
            const [selectedSupervisor, setSelectedSupervisor] = useState('all');
            const [selectedGrade, setSelectedGrade] = useState('all');

            const [sortConfig, setSortConfig] = useState({ key: 'date', direction: 'desc' });

            const alignChartRef = useRef(null);
            const hqimChartRef = useRef(null);
            const mapContainerRef = useRef(null);

            const alignChartInstance = useRef(null);
            const hqimChartInstance = useRef(null);
            const leafletMapInstance = useRef(null);
            const markersLayerGroup = useRef(null);

            const parseCSV = (text) => {
                const rows = [];
                let row = [];
                let cell = '';
                let inQuotes = false;

                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    const nextChar = text[i + 1];

                    if (char === '"') {
                        if (inQuotes && nextChar === '"') {
                            cell += '"';
                            i++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (char === ',' && !inQuotes) {
                        row.push(cell.trim());
                        cell = '';
                    } else if ((char === '\r' || char === '\n') && !inQuotes) {
                        if (char === '\r' && nextChar === '\n') {
                            i++;
                        }
                        row.push(cell.trim());
                        rows.push(row);
                        row = [];
                        cell = '';
                    } else {
                        cell += char;
                    }
                }
                if (cell || row.length > 0) {
                    row.push(cell.trim());
                    rows.push(row);
                }
                return rows;
            };

            const fetchAllData = async () => {
                setLoading(true);
                setError(null);
                // Owners are fetched independently: a failure there never blocks the other views, and vice versa.
                const ownersPromise = fetch(DIM_INITIATIVE_OWNERS_CSV_URL)
                    .then(function(res) {
                        if (!res.ok) throw new Error(`Initiative Owners HTTP ${res.status}`);
                        return res.text();
                    })
                    .then(function(text) {
                        setOwners(buildOwners(parseCSV(text)));
                        setOwnersError(null);
                    })
                    .catch(function(err) {
                        console.error('Initiative Owners Error:', err);
                        setOwnersError(err.message);
                    });
                const goalsPromise = fetch(DIM_GOAL_GUARDRAIL_CSV_URL)
                    .then(function(res) {
                        if (!res.ok) throw new Error(`Goal and Guardrail HTTP ${res.status}`);
                        return res.text();
                    })
                    .then(function(text) {
                        setGoals(buildOwners(parseCSV(text)));
                        setGoalsError(null);
                    })
                    .catch(function(err) {
                        console.error('Goal and Guardrail Error:', err);
                        setGoalsError(err.message);
                    });
                const districtGoalsPromise = fetch(FACT_DISTRICT_GOALS_CSV_URL)
                    .then(function(res) {
                        if (!res.ok) throw new Error(`District Goals HTTP ${res.status}`);
                        return res.text();
                    })
                    .then(function(text) {
                        setDistrictGoals(buildDistrictGoals(parseCSV(text)));
                        setDistrictGoalsError(null);
                    })
                    .catch(function(err) {
                        console.error('District Goals Error:', err);
                        setDistrictGoalsError(err.message);
                    });
                try {
                    // Visits are fetched alongside, but a failure there must not break the walkthrough view.
                    const visitsTextPromise = fetch(FACT_VISITS_CSV_URL)
                        .then(function(res) {
                            if (!res.ok) throw new Error(`Instructional Visits HTTP ${res.status}`);
                            return res.text();
                        })
                        .then(function(text) { return { text: text }; }, function(err) { return { error: err.message }; });

                    const [factRes, dimRes] = await Promise.all([
                        fetch(FACT_WALKTHROUGHS_CSV_URL),
                        fetch(DIM_SCHOOL_CSV_URL)
                    ]);

                    if (!factRes.ok) throw new Error(`Fact Table HTTP ${factRes.status}`);
                    if (!dimRes.ok) throw new Error(`Dim_School HTTP ${dimRes.status}`);

                    const factCsvText = await factRes.text();
                    const dimCsvText = await dimRes.text();

                    const parsedFactRows = parseCSV(factCsvText);
                    const parsedDimRows = parseCSV(dimCsvText);

                    const dimMap = {};
                    if (parsedDimRows.length > 1) {
                        const dimHeaders = parsedDimRows[0].map(function(h) { return h.trim().toLowerCase(); });
                        const schoolKeyIdx = dimHeaders.findIndex(function(h) { return (h.includes('school') && !h.includes('level')) || h === 'name'; });
                        const locIdIdx = dimHeaders.findIndex(function(h) { return h.includes('locationid') || h.includes('location id') || h.includes('location'); });
                        const levelIdx = dimHeaders.findIndex(function(h) { return h.includes('school level') || h.includes('level'); });
                        const frameworkIdx = dimHeaders.findIndex(function(h) { return h.includes('performance framework') || h.includes('framework') || h.includes('aps performance'); });
                        const supervisorIdx = dimHeaders.findIndex(function(h) { return h.includes('supervisor'); });
                        const latIdx = dimHeaders.findIndex(function(h) { return h === 'latitude' || h === 'lat' || h.includes('latitude'); });
                        const lngIdx = dimHeaders.findIndex(function(h) { return h === 'longitude' || h === 'lon' || h === 'lng' || h.includes('longitude'); });

                        parsedDimRows.slice(1).forEach(function(r) {
                            const schoolName = r[schoolKeyIdx >= 0 ? schoolKeyIdx : 0];
                            if (schoolName) {
                                let coords = null;
                                if (latIdx >= 0 && lngIdx >= 0 && r[latIdx] && r[lngIdx]) {
                                    const parsedLat = parseFloat(r[latIdx]);
                                    const parsedLng = parseFloat(r[lngIdx]);
                                    if (!isNaN(parsedLat) && !isNaN(parsedLng)) {
                                        coords = [parsedLat, parsedLng];
                                    }
                                }
                                if (!coords) {
                                    coords = getAlbuquerqueCoordinates(schoolName);
                                }

                                dimMap[schoolName.trim()] = {
                                    rawRow: r,
                                    schoolName: schoolName.trim(),
                                    locationId: (locIdIdx >= 0 ? r[locIdIdx] : '') || 'N/A',
                                    schoolLevel: (levelIdx >= 0 ? r[levelIdx] : '') || 'N/A',
                                    performanceFramework: (frameworkIdx >= 0 ? r[frameworkIdx] : '') || 'N/A',
                                    supervisor: (supervisorIdx >= 0 ? r[supervisorIdx] : '') || 'N/A',
                                    coordinates: coords
                                };
                            }
                        });
                    }
                    setSchoolDimMap(dimMap);

                    const visitsResult = await visitsTextPromise;
                    if (visitsResult.error) {
                        setVisitsError(visitsResult.error);
                    } else {
                        try {
                            setVisits(buildVisits(parseCSV(visitsResult.text), dimMap));
                            setVisitsError(null);
                        } catch (visitsErr) {
                            console.error('Instructional Visits Parse Error:', visitsErr);
                            setVisitsError(visitsErr.message);
                        }
                    }

                    if (parsedFactRows.length < 2) throw new Error('Walkthrough Fact CSV appears empty.');

                    const factHeaders = parsedFactRows[0].map(function(h) { return h.trim().toLowerCase(); });
                    const domainIdx = factHeaders.findIndex(function(h) { return h.includes('domain') || h.includes('subject'); });
                    const schoolIdx = factHeaders.findIndex(function(h) { return h.includes('school'); });
                    const dateIdx = factHeaders.findIndex(function(h) { return h.includes('date') || h.includes('timestamp'); });
                    const gradeIdx = factHeaders.findIndex(function(h) { return h.includes('grade level') || h.includes('grade'); });
                    const alignIdx = factHeaders.findIndex(function(h) { return h.includes('standard') || h.includes('alignment'); });
                    const hqimIdx = factHeaders.findIndex(function(h) { return h.includes('hqim') || h.includes('materials'); });
                    const taskIdx = factHeaders.findIndex(function(h) { return h.includes('task') || h.includes('observed') || h.includes('lesson'); });

                    const formatted = parsedFactRows.slice(1)
                        .filter(function(r) {
                            const hasValues = r.some(function(cell) { return cell.length > 0; });
                            const isHeaderRow = r[0] && r[0].toLowerCase().includes('subject domain');
                            return hasValues && !isHeaderRow;
                        })
                        .map(function(r, i) {
                            const rawDomain = (domainIdx >= 0 ? r[domainIdx] : r[0]) || '';
                            let domain = 'Other';

                            if (rawDomain.toLowerCase().includes('math')) {
                                domain = 'Math';
                            } else if (rawDomain.toLowerCase().includes('literacy')) {
                                domain = 'Early Literacy';
                            }

                            const schoolName = (schoolIdx >= 0 ? r[schoolIdx] : r[1]) || 'N/A';
                            const dimData = dimMap[schoolName.trim()] || {};

                            return {
                                id: i + 1,
                                domain: domain,
                                school: schoolName,
                                locationId: dimData.locationId || 'N/A',
                                schoolLevel: dimData.schoolLevel || 'N/A',
                                performanceFramework: dimData.performanceFramework || 'N/A',
                                supervisor: dimData.supervisor || 'N/A',
                                coordinates: dimData.coordinates || getAlbuquerqueCoordinates(schoolName),
                                date: (dateIdx >= 0 ? r[dateIdx] : '') || 'N/A',
                                grade: (gradeIdx >= 0 ? r[gradeIdx] : r[2]) || 'N/A',
                                alignment: (alignIdx >= 0 ? r[alignIdx] : r[4]) || 'Unable to Determine',
                                hqim: (hqimIdx >= 0 ? r[hqimIdx] : r[5]) || 'Not Observed',
                                task: (taskIdx >= 0 ? r[taskIdx] : r[6]) || 'N/A'
                            };
                        })
                        .filter(function(item) { return item.domain === 'Math' || item.domain === 'Early Literacy'; });

                    setData(formatted);
                    setSyncTime(new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }));
                } catch (err) {
                    console.error("Star Schema Data Fetch Error:", err);
                    setError(err.message);
                } finally {
                    await Promise.all([ownersPromise, goalsPromise, districtGoalsPromise]);
                    setLoading(false);
                }
            };

            useEffect(function() {
                fetchAllData();
                const interval = setInterval(fetchAllData, 900000);
                return function() { clearInterval(interval); };
            }, []);

            const schoolsList = useMemo(function() {
                const combined = Object.keys(schoolDimMap).length > 0 ? Object.keys(schoolDimMap) : data.map(function(d) { return d.school; });
                return [...new Set(combined)].filter(function(s) { return s && s !== 'N/A'; }).sort();
            }, [data, schoolDimMap]);

            const levelsList = useMemo(function() {
                const dimLevels = Object.values(schoolDimMap).map(function(s) { return s.schoolLevel; });
                const factLevels = data.map(function(d) { return d.schoolLevel; });
                return [...new Set([...dimLevels, ...factLevels])].filter(function(l) { return l && l !== 'N/A'; }).sort();
            }, [data, schoolDimMap]);

            const frameworksList = useMemo(function() {
                const dimFrameworks = Object.values(schoolDimMap).map(function(s) { return s.performanceFramework; });
                const factFrameworks = data.map(function(d) { return d.performanceFramework; });
                return [...new Set([...dimFrameworks, ...factFrameworks])].filter(function(f) { return f && f !== 'N/A'; }).sort();
            }, [data, schoolDimMap]);

            const supervisorsList = useMemo(function() {
                const dimSupervisors = Object.values(schoolDimMap).map(function(s) { return s.supervisor; });
                const factSupervisors = data.map(function(d) { return d.supervisor; });
                return [...new Set([...dimSupervisors, ...factSupervisors])].filter(function(s) { return s && s !== 'N/A'; }).sort();
            }, [data, schoolDimMap]);

            const gradesList = useMemo(function() {
                const uniqueGrades = [...new Set(data.map(function(d) { return d.grade; }))].filter(function(g) { return g && g !== 'N/A'; });
                return uniqueGrades.sort(function(a, b) {
                    const numA = parseFloat(a.replace(/[^0-9.]/g, ''));
                    const numB = parseFloat(b.replace(/[^0-9.]/g, ''));
                    if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
                    return a.localeCompare(b);
                });
            }, [data]);

            // Faceted option counts for the filter dropdowns.
            // Each dropdown counts observations matching every OTHER active filter (domain toggle,
            // chart bar selections, and the remaining dropdowns) but ignores its own selection,
            // so switching options never collapses the list to a single non-zero count.
            const filterOptionCounts = useMemo(function() {
                const matchAlignBar = function(item) {
                    if (selectedAlignmentBar === 'all') return true;
                    const v = item.alignment.toLowerCase().trim();
                    if (selectedAlignmentBar === 'Observed') return v === 'observed';
                    if (selectedAlignmentBar === 'Partially Observed') return v.includes('partial');
                    return !v.includes('observed') || v.includes('not');
                };
                const matchHqimBar = function(item) {
                    if (selectedHqimBar === 'all') return true;
                    const v = item.hqim.toLowerCase().trim();
                    if (selectedHqimBar === 'Observed') return v === 'observed';
                    if (selectedHqimBar === 'Partially Observed') return v.includes('partial');
                    return !v.includes('observed') || v.includes('not observed') || v.includes('unable') || v === 'n/a' || !v;
                };
                const matchesExcept = function(item, skip) {
                    if (activeDomain !== 'all' && item.domain !== activeDomain) return false;
                    if (skip !== 'school' && selectedSchool !== 'all' && item.school !== selectedSchool) return false;
                    if (skip !== 'level' && selectedLevel !== 'all' && item.schoolLevel !== selectedLevel) return false;
                    if (skip !== 'framework' && selectedFramework !== 'all' && item.performanceFramework !== selectedFramework) return false;
                    if (skip !== 'supervisor' && selectedSupervisor !== 'all' && item.supervisor !== selectedSupervisor) return false;
                    if (skip !== 'grade' && selectedGrade !== 'all' && item.grade !== selectedGrade) return false;
                    return matchAlignBar(item) && matchHqimBar(item);
                };
                const facets = {
                    supervisor: 'supervisor',
                    level: 'schoolLevel',
                    framework: 'performanceFramework',
                    grade: 'grade',
                    school: 'school'
                };
                const result = {};
                Object.keys(facets).forEach(function(facet) {
                    const field = facets[facet];
                    const counts = { __all: 0 };
                    data.forEach(function(item) {
                        if (!matchesExcept(item, facet)) return;
                        counts.__all += 1;
                        const key = item[field];
                        counts[key] = (counts[key] || 0) + 1;
                    });
                    result[facet] = counts;
                });
                return result;
            }, [data, activeDomain, selectedSchool, selectedLevel, selectedFramework, selectedSupervisor, selectedGrade, selectedAlignmentBar, selectedHqimBar]);

            const countFor = function(facet, value) {
                const counts = filterOptionCounts[facet] || {};
                return counts[value] || 0;
            };

            const filteredData = useMemo(function() {
                return data.filter(function(item) {
                    const matchesDomain = activeDomain === 'all' || item.domain === activeDomain;
                    const matchesSchool = selectedSchool === 'all' || item.school === selectedSchool;
                    const matchesLevel = selectedLevel === 'all' || item.schoolLevel === selectedLevel;
                    const matchesFramework = selectedFramework === 'all' || item.performanceFramework === selectedFramework;
                    const matchesSupervisor = selectedSupervisor === 'all' || item.supervisor === selectedSupervisor;
                    const matchesGrade = selectedGrade === 'all' || item.grade === selectedGrade;

                    let matchesAlignBar = true;
                    const alignLower = item.alignment.toLowerCase().trim();
                    if (selectedAlignmentBar === 'Observed') {
                        matchesAlignBar = alignLower === 'observed';
                    } else if (selectedAlignmentBar === 'Partially Observed') {
                        matchesAlignBar = alignLower.includes('partial');
                    } else if (selectedAlignmentBar === 'Other / Not Observed') {
                        matchesAlignBar = !alignLower.includes('observed') || alignLower.includes('not');
                    }

                    let matchesHqimBar = true;
                    const hqimLower = item.hqim.toLowerCase().trim();
                    if (selectedHqimBar === 'Observed') {
                        matchesHqimBar = hqimLower === 'observed';
                    } else if (selectedHqimBar === 'Partially Observed') {
                        matchesHqimBar = hqimLower.includes('partial');
                    } else if (selectedHqimBar === 'Other / Not Observed') {
                        matchesHqimBar = !hqimLower.includes('observed') || hqimLower.includes('not observed') || hqimLower.includes('unable') || hqimLower === 'n/a' || !hqimLower;
                    }

                    return matchesDomain && matchesSchool && matchesLevel && matchesFramework && matchesSupervisor && matchesGrade && matchesAlignBar && matchesHqimBar;
                });
            }, [data, activeDomain, selectedSchool, selectedLevel, selectedFramework, selectedSupervisor, selectedGrade, selectedAlignmentBar, selectedHqimBar]);

            const sortedData = useMemo(function() {
                if (!sortConfig.key) return filteredData;
                const sorted = [...filteredData].sort(function(a, b) {
                    let valA = a[sortConfig.key] || '';
                    let valB = b[sortConfig.key] || '';

                    if (sortConfig.key === 'grade') {
                        const numA = parseFloat(String(valA).replace(/[^0-9.]/g, ''));
                        const numB = parseFloat(String(valB).replace(/[^0-9.]/g, ''));
                        if (!isNaN(numA) && !isNaN(numB)) {
                            return sortConfig.direction === 'asc' ? numA - numB : numB - numA;
                        }
                    }

                    if (sortConfig.key === 'date') {
                        const dateA = new Date(valA).getTime();
                        const dateB = new Date(valB).getTime();
                        if (!isNaN(dateA) && !isNaN(dateB)) {
                            return sortConfig.direction === 'asc' ? dateA - dateB : dateB - dateA;
                        }
                    }

                    valA = String(valA).toLowerCase();
                    valB = String(valB).toLowerCase();
                    return sortConfig.direction === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                });
                return sorted;
            }, [filteredData, sortConfig]);

            const handleSort = function(key) {
                setSortConfig(function(prev) {
                    if (prev.key === key) {
                        return { key: key, direction: prev.direction === 'asc' ? 'desc' : 'asc' };
                    }
                    return { key: key, direction: 'asc' };
                });
            };

            const renderSortIcon = function(key) {
                if (sortConfig.key !== key) {

        // ---------- Interim Guardrail 2.2: Instructional Visits dashboard ----------

        const DEFAULT_VISIT_FILTERS = { staff: 'all', designation: 'all', level: 'all', status: 'all', school: 'all', month: 'all', measure: 'all' };
        const DESIGNATION_ORDER = ['Priority', 'Emerging', 'Acceleration', 'Distinction'];

        function visitMonthLabel(key) {
            const parts = key.split('-');
            const d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, 1);
            return d.toLocaleString('en-US', { month: 'short', year: 'numeric' });
        }

        // Map pin color by number of completed visits at the school (within the current filters)
        function getVisitColorByCompleted(n) {
            if (n === 0) return '#94a3b8';
            if (n === 1) return '#f59e0b';
            if (n === 2) return '#0284c7';
            return '#10b981';
        }

        function buildVisitMarkerHtml(shapeClass, color, isSelected) {
            if (shapeClass === 'marker-triangle') {
                return `<div class="school-map-marker ${shapeClass}" style="border-bottom-color: ${color} !important; ${isSelected ? 'filter: drop-shadow(0 0 6px #0f172a); transform: scale(1.35);' : ''}"></div>`;
            }
            const border = isSelected ? '3px solid #0f172a' : '2px solid #ffffff';
            const sizes = {
                'marker-diamond': isSelected ? [18, 2] : [14, 3],
                'marker-square': isSelected ? [19, 1] : [15, 2],
                'marker-circle': isSelected ? [20, 1] : [16, 2]
            }[shapeClass] || [16, 2];
            return `<div class="school-map-marker ${shapeClass}" style="background-color: ${color}; width: ${sizes[0]}px; height: ${sizes[0]}px; border: ${border}; margin: ${sizes[1]}px auto;"></div>`;
        }

        function VisitsDashboard(props) {
            const visits = props.visits;
            const schoolDimMap = props.schoolDimMap;
            const loading = props.loading;

            const [filters, setFilters] = useState(DEFAULT_VISIT_FILTERS);
            const [sortConfig, setSortConfig] = useState({ key: 'date', direction: 'desc' });

            const monthChartRef = useRef(null);
            const staffChartRef = useRef(null);
            const measureChartRef = useRef(null);
            const chartInstances = useRef({});
            const mapContainerRef = useRef(null);
            const mapInstance = useRef(null);
            const markersLayer = useRef(null);

            const setFilter = function(key, value) {
                setFilters(function(prev) { const next = Object.assign({}, prev); next[key] = value; return next; });
            };
            const toggleFilter = function(key, value) {
                setFilters(function(prev) { const next = Object.assign({}, prev); next[key] = prev[key] === value ? 'all' : value; return next; });
            };
            const anyFilterActive = Object.keys(filters).some(function(k) { return filters[k] !== 'all'; });

            // Every component respects all filters except its own dimension (same pattern as the walkthrough view),
            // so clicking a bar never collapses that chart to a single bar.
            const matchesExcept = useMemo(function() {
                return function(v, skip) {
                    if (skip !== 'staff' && filters.staff !== 'all' && v.staff !== filters.staff) return false;
                    if (skip !== 'designation' && filters.designation !== 'all' && v.designation !== filters.designation) return false;
                    if (skip !== 'level' && filters.level !== 'all' && v.schoolLevel !== filters.level) return false;
                    if (skip !== 'status' && filters.status !== 'all' && v.status !== filters.status) return false;
                    if (skip !== 'school' && filters.school !== 'all' && v.school !== filters.school) return false;
                    if (skip !== 'month' && filters.month !== 'all' && v.monthKey !== filters.month) return false;
                    if (skip !== 'measure' && filters.measure !== 'all' && v.measures.indexOf(filters.measure) < 0) return false;
                    return true;
                };
            }, [filters]);

            const filtered = useMemo(function() {
                return visits.filter(function(v) { return matchesExcept(v, null); });
            }, [visits, matchesExcept]);

            const staffList = useMemo(function() { return [...new Set(visits.map(function(v) { return v.staff; }))].sort(); }, [visits]);
            const designationList = useMemo(function() {
                return [...new Set(visits.map(function(v) { return v.designation; }))].sort(function(a, b) {
                    const ia = DESIGNATION_ORDER.indexOf(a);
                    const ib = DESIGNATION_ORDER.indexOf(b);
                    return ((ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib)) || a.localeCompare(b);
                });
            }, [visits]);
            const levelList = useMemo(function() {
                return [...new Set(visits.map(function(v) { return v.schoolLevel; }))].filter(function(l) { return l && l !== 'N/A'; }).sort();
            }, [visits]);
            const schoolList = useMemo(function() { return [...new Set(visits.map(function(v) { return v.school; }))].sort(); }, [visits]);
            const statusList = useMemo(function() {
                return VISIT_STATUSES.filter(function(s) { return visits.some(function(v) { return v.status === s; }); });
            }, [visits]);
            const monthList = useMemo(function() {
                return [...new Set(visits.map(function(v) { return v.monthKey; }).filter(Boolean))].sort();
            }, [visits]);
            const measureList = useMemo(function() {
                const s = new Set();
                visits.forEach(function(v) { v.measures.forEach(function(m) { s.add(m); }); });
                return [...s];
            }, [visits]);

            const facetCounts = useMemo(function() {
                const fields = { staff: 'staff', designation: 'designation', level: 'schoolLevel', status: 'status', school: 'school' };
                const out = {};
                Object.keys(fields).forEach(function(f) {
                    const counts = { __all: 0 };
                    visits.forEach(function(v) {
                        if (!matchesExcept(v, f)) return;
                        counts.__all += 1;
                        const k = v[fields[f]];
                        counts[k] = (counts[k] || 0) + 1;
                    });
                    out[f] = counts;
                });
                return out;
            }, [visits, matchesExcept]);
            const countFor = function(f, value) { return (facetCounts[f] && facetCounts[f][value]) || 0; };

            const kpis = useMemo(function() {
                const base = visits.filter(function(v) { return matchesExcept(v, 'status'); });
                const byStatus = {};
                VISIT_STATUSES.forEach(function(s) { byStatus[s] = 0; });
                base.forEach(function(v) { byStatus[v.status] += 1; });
                const schools = new Set(base.map(function(v) { return v.school; }));
                const visited = new Set(base.filter(function(v) { return v.status === 'Completed'; }).map(function(v) { return v.school; }));
                return { total: base.length, byStatus: byStatus, schools: schools.size, visited: visited.size };
            }, [visits, matchesExcept]);

            const dateIssues = useMemo(function() { return visits.filter(function(v) { return v.dateIssue; }); }, [visits]);
            const unmatchedSchools = useMemo(function() {
                return [...new Set(visits.filter(function(v) { return !v.dimKey; }).map(function(v) { return v.school; }))].sort();
            }, [visits]);
            const unlocatedSchools = useMemo(function() {
                return [...new Set(visits.filter(function(v) {
                    return v.dimKey && schoolDimMap[v.dimKey] && !schoolDimMap[v.dimKey].coordinates;
                }).map(function(v) { return v.school; }))].sort();
            }, [visits, schoolDimMap]);
            const noMeasureCount = filtered.filter(function(v) { return v.measures.length === 0; }).length;

            // ---- Charts ----
            useEffect(function() {
                if (!monthChartRef.current || !staffChartRef.current || !measureChartRef.current) return;
                const inst = chartInstances.current;
                const draw = function(name, canvas, config) {
                    if (inst[name]) inst[name].destroy();
                    inst[name] = new Chart(canvas, config);
                };
                const dim = function(color, active) { return active ? color : color + '40'; };

                const statusDatasets = function(rows, keys, keyFn, selected) {
                    return VISIT_STATUSES.map(function(st) {
                        return {
                            label: st,
                            data: keys.map(function(k) { return rows.filter(function(v) { return v.status === st && keyFn(v) === k; }).length; }),
                            backgroundColor: keys.map(function(k) { return dim(VISIT_STATUS_COLORS[st], selected === 'all' || selected === k); }),
                            borderRadius: 3,
                            maxBarThickness: 40
                        };
                    }).filter(function(ds) { return ds.data.some(function(n) { return n > 0; }); });
                };

                // Data labels for stacked bars: a count inside each segment large enough to hold it,
                // plus the stack total at the end of each bar.
                const stackedDataLabels = function(datasets, horizontal) {
                    const count = datasets.length ? datasets[0].data.length : 0;
                    const totals = [];
                    for (let i = 0; i < count; i++) {
                        totals.push(datasets.reduce(function(sum, ds) { return sum + ds.data[i]; }, 0));
                    }
                    const maxTotal = Math.max.apply(null, totals.concat([1]));
                    const isTopSegment = function(ctx) {
                        const i = ctx.dataIndex;
                        if (!(ctx.dataset.data[i] > 0)) return false;
                        for (let d = ctx.datasetIndex + 1; d < datasets.length; d++) {
                            if (datasets[d].data[i] > 0) return false;
                        }
                        return true;
                    };
                    return {
                        labels: {
                            value: {
                                anchor: 'center',
                                align: 'center',
                                font: { weight: 'bold', size: 10 },
                                color: function(ctx) {
                                    return ctx.dataset.label === 'Past Date, Not Marked Complete' ? '#1f2937' : '#ffffff';
                                },
                                display: function(ctx) {
                                    const v = ctx.dataset.data[ctx.dataIndex];
                                    return v > 0 && v >= maxTotal * 0.07;
                                },
                                formatter: function(v) { return v; }
                            },
                            total: {
                                anchor: 'end',
                                align: horizontal ? 'right' : 'top',
                                offset: 2,
                                font: { weight: 'bold', size: 10 },
                                color: '#334155',
                                display: isTopSegment,
                                formatter: function(v, ctx) { return totals[ctx.dataIndex]; }
                            }
                        }
                    };
                };

                const stackedOptions = function(onPick, horizontal, keys, datasets) {
                    return {
                        responsive: true,
                        maintainAspectRatio: false,
                        indexAxis: horizontal ? 'y' : 'x',
                        interaction: { mode: 'index', intersect: false, axis: horizontal ? 'y' : 'x' },
                        onClick: function(evt, els) { if (els && els.length) onPick(keys[els[0].index]); },
                        layout: { padding: horizontal ? { right: 28 } : { top: 18 } },
                        plugins: {
                            legend: { display: false },
                            datalabels: stackedDataLabels(datasets, horizontal),
                            tooltip: {
                                callbacks: {
                                    footer: function(items) {
                                        const total = items.reduce(function(sum, it) { return sum + it.parsed[horizontal ? 'x' : 'y']; }, 0);
                                        return 'Total: ' + total;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: { stacked: true, ticks: { precision: 0, font: { size: 10 } }, grid: { display: horizontal } },
                            y: { stacked: true, ticks: { precision: 0, font: { size: 10 } }, grid: { display: !horizontal } }
                        }
                    };
                };

                const monthRows = visits.filter(function(v) { return v.monthKey && matchesExcept(v, 'month'); });
                const monthDatasets = statusDatasets(monthRows, monthList, function(v) { return v.monthKey; }, filters.month);
                draw('month', monthChartRef.current, {
                    type: 'bar',
                    data: { labels: monthList.map(visitMonthLabel), datasets: monthDatasets },
                    options: stackedOptions(function(k) { toggleFilter('month', k); }, false, monthList, monthDatasets)
                });

                const staffRows = visits.filter(function(v) { return matchesExcept(v, 'staff'); });
                const staffDatasets = statusDatasets(staffRows, staffList, function(v) { return v.staff; }, filters.staff);
                draw('staff', staffChartRef.current, {
                    type: 'bar',
                    data: { labels: staffList, datasets: staffDatasets },
                    options: stackedOptions(function(k) { toggleFilter('staff', k); }, true, staffList, staffDatasets)
                });


                const measureRows = visits.filter(function(v) { return matchesExcept(v, 'measure'); });
                const mCounts = measureList.map(function(m) {
                    return { m: m, n: measureRows.filter(function(v) { return v.measures.indexOf(m) >= 0; }).length };
                }).sort(function(a, b) { return (b.n - a.n) || a.m.localeCompare(b.m); });
                const mKeys = mCounts.map(function(x) { return x.m; });
                draw('measure', measureChartRef.current, {
                    type: 'bar',
                    data: {
                        labels: mKeys.map(function(m) { return m.split(' — '); }),
                        datasets: [{
                            data: mCounts.map(function(x) { return x.n; }),
                            backgroundColor: mKeys.map(function(k) { return dim('#6366f1', filters.measure === 'all' || filters.measure === k); }),
                            borderRadius: 4,
                            maxBarThickness: 20
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        indexAxis: 'y',
                        onClick: function(evt, els) { if (els && els.length) toggleFilter('measure', mKeys[els[0].index]); },
                        layout: { padding: { right: 28 } },
                        plugins: {
                            legend: { display: false },
                            datalabels: {
                                anchor: 'end', align: 'right', offset: 2,
                                font: { weight: 'bold', size: 10 }, color: '#334155',
                                formatter: function(value) { return value || ''; }
                            }
                        },
                        scales: {
                            x: { ticks: { precision: 0, font: { size: 10 } } },
                            y: { ticks: { font: { size: 10 } }, grid: { display: false } }
                        }
                    }
                });
            }, [visits, matchesExcept, filters, monthList, staffList, designationList, measureList]);

            useEffect(function() {
                return function() {
                    const inst = chartInstances.current;
                    Object.keys(inst).forEach(function(k) { if (inst[k]) inst[k].destroy(); });
                    chartInstances.current = {};
                };
            }, []);

            // ---- Map: created once per mount, removed on unmount ----
            useEffect(function() {
                if (!mapContainerRef.current) return;
                const map = L.map(mapContainerRef.current, { center: DEFAULT_MAP_CENTER, zoom: DEFAULT_MAP_ZOOM, zoomControl: false });
                L.control.zoom({ position: 'topleft' }).addTo(map);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                    maxZoom: 19
                }).addTo(map);
                markersLayer.current = L.layerGroup().addTo(map);
                mapInstance.current = map;

                let observer = null;
                if (typeof ResizeObserver !== 'undefined') {
                    observer = new ResizeObserver(function() { map.invalidateSize(); });
                    observer.observe(mapContainerRef.current);
                }
                return function() {
                    if (observer) observer.disconnect();
                    map.remove();
                    mapInstance.current = null;
                    markersLayer.current = null;
                };
            }, []);

            useEffect(function() {
                const map = mapInstance.current;
                const layer = markersLayer.current;
                if (!map || !layer) return;
                layer.clearLayers();

                const groups = {};
                visits.forEach(function(v) {
                    if (!v.dimKey || !matchesExcept(v, 'school')) return;
                    (groups[v.school] = groups[v.school] || []).push(v);
                });

                const bounds = [];
                let selectedCoords = null;
                let selectedMarker = null;

                Object.keys(groups).forEach(function(name) {
                    const rows = groups[name];
                    const dimInfo = schoolDimMap[rows[0].dimKey] || {};
                    const coords = dimInfo.coordinates || getAlbuquerqueCoordinates(name);
                    if (!coords) return;
                    const completed = rows.filter(function(v) { return v.status === 'Completed'; }).length;
                    const isSelected = filters.school === name;
                    const color = getVisitColorByCompleted(completed);
                    const shape = getShapeByLevel(dimInfo.schoolLevel, name);
                    bounds.push(coords);

                    const marker = L.marker(coords, {
                        icon: L.divIcon({ className: 'custom-leaflet-pin', html: buildVisitMarkerHtml(shape, color, isSelected), iconSize: [22, 22], iconAnchor: [11, 11] })
                    });

        // ---------- Goals and Guardrails Status dashboard ----------
        // Measured rows (Has Target = TRUE) take their values from fact_district_goals.
        // Grouping rows (Has Target = FALSE) roll up from their children per the Rollup Rule:
        // On-Track only when every counted child is On-Track; Off-Track if any child is Off-Track.

        function GoalStatusDashboard(props) {
            const goals = props.goals;
            const facts = props.facts;
            const loading = props.loading;
            // 'latest' = each goal's most recent school year with data; otherwise a specific school year
            const [yearMode, setYearMode] = useState('latest');

            const years = useMemo(function() {
                return [...new Set(facts.map(function(f) { return f.schoolYear; }).filter(Boolean))].sort().reverse();
            }, [facts]);

            const dimById = useMemo(function() {
                const m = {};
                goals.forEach(function(g) { if (g.id) m[g.id] = g; });
                return m;
            }, [goals]);

            // Fact rows per Goal ID, newest school year first
            const factsById = useMemo(function() {
                const m = {};
                facts.forEach(function(f) { (m[f.goalId] = m[f.goalId] || []).push(f); });
                Object.keys(m).forEach(function(k) {
                    m[k].sort(function(a, b) { return b.schoolYear.localeCompare(a.schoolYear) || (a.order - b.order); });
                });
                return m;
            }, [facts]);

            const pickFact = function(id, year) {
                const list = factsById[id] || [];
                if (year) return list.find(function(f) { return f.schoolYear === year; }) || null;
                return list[0] || null;
            };

            const childrenFor = function(g) {
                const type = parseRollupType(g.rollupRule);
                return goals.filter(function(c) {
                    return c.parentId === g.id && c.hasTarget && (!type || c.measureType.toLowerCase() === type);
                });
            };

            const evaluated = useMemo(function() {
                const out = {};
                const fixedYear = yearMode === 'latest' ? null : yearMode;
                goals.forEach(function(g) {
                    if (!g.hasTarget) return;

                const byType = {};
                all.forEach(function(o) { byType[o.measureType] = (byType[o.measureType] || 0) + 1; });
                const ownerAssigned = all.filter(function(o) { return o.owner !== OWNER_UNASSIGNED; }).length;
                const sponsorAssigned = all.filter(function(o) { return o.sponsor !== OWNER_UNASSIGNED; }).length;
                const cabinet = new Set(all.map(function(o) { return o.cabinet; }).filter(function(c) { return c !== OWNER_UNASSIGNED; })).size;
                return { total: total, byType: byType, ownerAssigned: ownerAssigned, sponsorAssigned: sponsorAssigned, cabinet: cabinet };
            }, [all]);

            const card = 'bg-white rounded-xl sm:rounded-2xl border border-gray-200 shadow-sm';
            const pct = function(n, d) { return d > 0 ? Math.round((n / d) * 100) : 0; };
            const kpiCard = function(label, value, colorClass, hint) {
                return e('div', { className: `${card} p-3.5 sm:p-5` },
                    e('span', { className: 'text-xs font-semibold uppercase text-gray-400 tracking-wider block leading-tight' }, label),
                    e('div', { className: `text-xl sm:text-2xl font-bold mt-1 ${colorClass}` }, loading && all.length === 0 ? '--' : value),
                    e('div', { className: 'text-xs text-gray-400 mt-0.5 leading-tight' }, hint)
                );
            };

            const typeSummary = Object.keys(kpis.byType)
                .sort(function(a, b) { return (measureTypeRank(a) - measureTypeRank(b)) || a.localeCompare(b); })
                .map(function(t) { return `${kpis.byType[t]} ${t}${kpis.byType[t] === 1 ? '' : 's'}`; })
                .join(' · ');

            return e('div', { className: 'space-y-4 sm:space-y-6' },
                // 1. KPI cards (across both tables)
                e('div', { className: 'grid grid-cols-2 lg:grid-cols-4 gap-2.5 sm:gap-4' },
                    kpiCard('Items Tracked', kpis.total, 'text-gray-800', typeSummary || 'None loaded'),
                    kpiCard('Owner Assigned', `${kpis.ownerAssigned} / ${kpis.total}`, 'text-green-600', `${pct(kpis.ownerAssigned, kpis.total)}% have a named owner`),
                    kpiCard('Executive Sponsor Assigned', `${kpis.sponsorAssigned} / ${kpis.total}`, 'text-blue-600', `${pct(kpis.sponsorAssigned, kpis.total)}% have a named sponsor`),
                    kpiCard('Cabinet Members', kpis.cabinet, 'text-purple-600', 'Leading at least one item')
                ),

                // 2. Goals and guardrails
                e(OwnersTable, { title: 'Goals and Guardrails', rows: goals, loading: loading, error: props.goalsError }),

                // 3. Promising practices and initiatives
                e(OwnersTable, { title: 'Promising Practices and Initiatives', rows: owners, loading: loading, error: props.error }),

                e('div', { className: 'text-xs text-gray-500 text-right px-1' }, `Updated ${props.syncTime}`)
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(App));
    </script>
</body>
</html>
